<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/v1/Pranav.png" />
    <link rel="apple-touch-icon" href="/v1/Pranav.png" />
    <link rel="manifest" href="/v1/manifest.json" />
    <title>Pranav Reddy Gaddam</title>
    <style>
      #v1-archive-banner{position:relative;z-index:2147483647;display:flex;align-items:center;justify-content:center;gap:.75rem;flex-wrap:wrap;padding:.5rem 1rem;background:rgba(10,8,20,.92);backdrop-filter:blur(6px);border-bottom:1px solid rgba(192,132,252,.5);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.06em;color:#e9d5ff;text-transform:uppercase}
      #v1-archive-banner span{opacity:.75}
      #v1-archive-banner a{color:#fff;text-decoration:none;border:1px solid rgba(192,132,252,.7);border-radius:6px;padding:.3rem .7rem;background:rgba(147,51,234,.18);transition:background .15s ease,transform .15s ease;white-space:nowrap}
      #v1-archive-banner a:hover{background:rgba(147,51,234,.4)}
      #v1-archive-banner a:active{transform:scale(.97)}
      /* The site header is `fixed top-0`; shift it below the bar. The offset is
         measured at runtime since the bar's height depends on wrapping. */
      #root header.fixed{top:var(--v1-bar-h,45px)}
      @media (max-width:480px){#v1-archive-banner{font-size:9px;padding:.4rem .6rem;gap:.5rem}}
    </style>
  </head>
  <body>
    <div id="v1-archive-banner">
      <span>&#9679; Archive &mdash; Portfolio v1 (2025)</span>
      <a href="/">&#9658; Back to current</a>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <script>
      // Keep the site's fixed header clear of the archive bar at any width.
      (function () {
        var sync = function () {
          var bar = document.getElementById('v1-archive-banner');
          if (bar) {
            document.documentElement.style.setProperty(
              '--v1-bar-h', bar.getBoundingClientRect().height + 'px');
          }
        };
        window.addEventListener('resize', sync);
        window.addEventListener('DOMContentLoaded', sync);
        sync();
      })();
    </script>
  </body>
</html>
